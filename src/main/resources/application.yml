server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:checador_db}?useSSL=${DB_USE_SSL:false}&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
    username: ${DB_USERNAME:root}
    # Sin valor por defecto — REQUIERE variable de entorno DB_PASSWORD
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    # Sin valor por defecto — REQUIERE variable de entorno JWT_SECRET (mín. 256 bits en Base64)
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  attendance:
    default-tolerance-minutes: ${ATTENDANCE_TOLERANCE_MINUTES:10}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@viagourmet.com}

logging:
  level:
    com.checador: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}

